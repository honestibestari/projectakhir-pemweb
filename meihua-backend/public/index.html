<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#C8587A" />
    <meta name="description" content="MeiHua Official — Toko Perhiasan Fine Jewelry Terpercaya" />
    <meta name="keywords" content="perhiasan, cincin, gelang, kalung, emas, berlian, MeiHua" />
    <meta name="author" content="MeiHua Official" />

    <!-- Open Graph -->
    <meta property="og:title" content="MeiHua Official — Fine Jewelry" />
    <meta property="og:description" content="Temukan koleksi perhiasan eksklusif berkualitas tinggi" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://localhost:3000" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Midtrans Snap SDK (Sandbox) -->
    <!-- Ganti ke https://app.midtrans.com/snap/snap.js jika sudah production -->
    <script
      type="text/javascript"
      src="https://app.sandbox.midtrans.com/snap/snap.js"
      data-client-key="Mid-client-A_AS86z7vid3nwG5"
    ></script>

    <title>MeiHua Official — Fine Jewelry</title>

    <style>
      /* Loading screen sebelum React mount */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #FBF6F8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: opacity 0.4s ease;
      }

      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-logo {
        width: 56px;
        height: 56px;
        margin-bottom: 20px;
        animation: loaderPulse 1.8s ease-in-out infinite;
      }

      .loader-text {
        font-size: 20px;
        font-weight: 700;
        color: #1C1117;
        margin: 0 0 4px;
        letter-spacing: 0.3px;
      }

      .loader-sub {
        font-size: 11px;
        color: #A08590;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin: 0 0 24px;
      }

      .loader-bar {
        width: 120px;
        height: 3px;
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          #E8D5DD 0%,
          #C8587A 50%,
          #E8D5DD 100%
        );
        background-size: 200%;
        animation: loaderShimmer 1.2s infinite;
      }

      @keyframes loaderShimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }

      @keyframes loaderPulse {
        0%, 100% { transform: scale(1);    opacity: 1;   }
        50%       { transform: scale(1.06); opacity: 0.85; }
      }

      /* Reset dasar agar tidak ada flash putih */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: #FBF6F8;
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root { height: 100%; }
    </style>
  </head>

  <body>
    <noscript>
      Anda perlu mengaktifkan JavaScript untuk menjalankan aplikasi ini.
    </noscript>

    <!-- Loading screen awal -->
    <div id="initial-loader">
      <!-- Logo SVG inline -->
      <svg class="loader-logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="mh-bg-load" x1="0" y1="0" x2="48" y2="48">
            <stop offset="0%" stop-color="#C8587A"/>
            <stop offset="100%" stop-color="#A33D5C"/>
          </linearGradient>
          <linearGradient id="mh-text-load" x1="0" y1="0" x2="48" y2="48">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#F5DCEA"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#mh-bg-load)"/>
        <path d="M11 33V16L18 25L24 16V33" stroke="url(#mh-text-load)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M27 16V33 M36 16V33 M27 24.5H36" stroke="url(#mh-text-load)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="24" cy="39" r="1.4" fill="rgba(255,255,255,0.5)"/>
      </svg>

      <p class="loader-text">MeiHua Official</p>
      <p class="loader-sub">Fine Jewelry</p>
      <div class="loader-bar"></div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script>
      // Sembunyikan loader setelah React selesai mount
      window.addEventListener('load', function () {
        setTimeout(function () {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function () {
              loader.remove();
            }, 400);
          }
        }, 800);
      });
    </script>
  </body>
</html>
